name: validate
on:
  push:
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse all PowerShell files with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.FullName)" -ForegroundColor Red
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Validate JSON profiles and settings
        shell: powershell
        run: |
          Get-ChildItem config,profiles -Filter *.json -Recurse | ForEach-Object {
            Get-Content $_.FullName -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
            Write-Host "OK $($_.FullName)"
          }

      - name: Validate XAML parses
        shell: powershell
        run: |
          Add-Type -AssemblyName PresentationFramework
          [xml]$x = Get-Content .\ui\MainWindow.xaml -Raw -Encoding UTF8
          $reader = New-Object System.Xml.XmlNodeReader $x
          $w = [Windows.Markup.XamlReader]::Load($reader)
          if (-not $w) { throw 'XAML did not load' }

      - name: Run Windows PowerShell runtime smoke tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem .\tests -Filter *.Tests.ps1 | Sort-Object Name | ForEach-Object {
            Write-Host "=== Running $($_.Name) ===" -ForegroundColor Cyan
            $global:LASTEXITCODE=0
            & $_.FullName
            if (-not $?) { throw "$($_.Name) reported a PowerShell failure." }
            if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "$($_.Name) failed with exit code $LASTEXITCODE" }
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare embedded offline payload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $stage=Join-Path $env:RUNNER_TEMP 'SitecQC-payload'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          @('Start-SitecQC.ps1','Invoke-SitecQC.ps1','Invoke-SitecQC-Compact.ps1','Verify-SitecQC.ps1','src','ui','config','profiles','tools','THIRD-PARTY-NOTICES.md') | ForEach-Object {
            Copy-Item -LiteralPath $_ -Destination $stage -Recurse -Force
          }

          $utf8Bom=New-Object System.Text.UTF8Encoding($true)
          Get-ChildItem -LiteralPath $stage -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1' } | ForEach-Object {
            $text=[IO.File]::ReadAllText($_.FullName,[Text.Encoding]::UTF8)
            [IO.File]::WriteAllText($_.FullName,$text,$utf8Bom)
          }

          $temp=Join-Path $env:RUNNER_TEMP 'SitecQC-deps'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null

          $diskZip=Join-Path $temp 'DiskSpd.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/microsoft/diskspd/releases/latest/download/DiskSpd.zip' -OutFile $diskZip
          $diskExtract=Join-Path $temp 'diskspd'
          Expand-Archive -LiteralPath $diskZip -DestinationPath $diskExtract -Force
          $disk=Get-ChildItem -LiteralPath $diskExtract -Filter diskspd.exe -Recurse | Where-Object { $_.FullName -match 'amd64|x64' } | Select-Object -First 1
          if (-not $disk) { throw 'DiskSpd x64 executable was not found.' }
          New-Item -ItemType Directory -Path (Join-Path $stage 'tools\bin') -Force | Out-Null
          Copy-Item -LiteralPath $disk.FullName -Destination (Join-Path $stage 'tools\bin\diskspd.exe') -Force

          $lhmZip=Join-Path $temp 'LibreHardwareMonitor.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip' -OutFile $lhmZip
          $lhmRoot=Join-Path $stage 'tools\librehardwaremonitor'
          if (Test-Path $lhmRoot) { Remove-Item $lhmRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $lhmRoot -Force | Out-Null
          Expand-Archive -LiteralPath $lhmZip -DestinationPath $lhmRoot -Force
          $dll=Get-ChildItem -LiteralPath $lhmRoot -Filter LibreHardwareMonitorLib.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'LibreHardwareMonitorLib.dll was not found.' }
          if ($dll.DirectoryName -ne $lhmRoot) { Get-ChildItem -LiteralPath $dll.DirectoryName -File | Copy-Item -Destination $lhmRoot -Force }

          $payload=Join-Path $PWD 'launcher\payload.zip'
          if (Test-Path $payload) { Remove-Item $payload -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $payload -CompressionLevel Optimal

      - name: Publish self-contained SitecQC.exe
        shell: powershell
        run: |
          dotnet publish .\launcher\SitecQC.Launcher.csproj -c Release -r win-x64 --self-contained true -o .\dist
          if (-not (Test-Path .\dist\SitecQC.exe)) { throw 'SitecQC.exe was not produced.' }
          [xml]$project=Get-Content .\launcher\SitecQC.Launcher.csproj -Raw -Encoding UTF8
          $expected=[string]$project.Project.PropertyGroup.Version
          $actual=(Get-Item .\dist\SitecQC.exe).VersionInfo.ProductVersion
          if ($actual -notlike "$expected*") { throw "Built SitecQC.exe version mismatch. Expected $expected, actual $actual" }
          Write-Host "Built SitecQC.exe version $actual"

      - name: Publish versioned GitHub Release executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          [xml]$project=Get-Content .\launcher\SitecQC.Launcher.csproj -Raw -Encoding UTF8
          $version=[string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Launcher version is empty.' }
          $tag="v$version"
          $assetName="SitecQC-Windows-x64-$tag.exe"
          $shaName="$assetName.sha256"
          $exe=(Resolve-Path .\dist\SitecQC.exe).Path
          $shaPath=Join-Path (Split-Path $exe -Parent) $shaName
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $shaPath -Encoding ASCII
          $releaseBody="Production self-contained Windows x64 build for SitecQC $tag.`n`nSHA-256: $hash"

          $api="https://api.github.com/repos/$env:GH_REPOSITORY"
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='SitecQC-CI'
          }

          try {
            $release=Invoke-RestMethod -UseBasicParsing -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
          } catch {
            $status=$null
            try { $status=[int]$_.Exception.Response.StatusCode } catch {}
            if ($status -ne 404) { throw }
            $body=@{
              tag_name=$tag
              target_commitish=$env:GITHUB_SHA
              name="SitecQC $tag"
              body=$releaseBody
              draft=$false
              prerelease=$false
              generate_release_notes=$false
            } | ConvertTo-Json -Depth 5
            $release=Invoke-RestMethod -UseBasicParsing -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $body
          }

          # Keep the rolling version tag/release aligned with the commit that produced
          # the current binary. This is especially important when a previous release
          # attempt created the tag but failed before uploading its assets.
          $refBody=@{ sha=$env:GITHUB_SHA; force=$true } | ConvertTo-Json
          Invoke-RestMethod -UseBasicParsing -Method Patch -Uri "$api/git/refs/tags/$tag" -Headers $headers -ContentType 'application/json' -Body $refBody | Out-Null

          $releasePatch=@{ name="SitecQC $tag"; body=$releaseBody; draft=$false; prerelease=$false } | ConvertTo-Json
          $release=Invoke-RestMethod -UseBasicParsing -Method Patch -Uri "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $releasePatch

          foreach ($asset in @($release.assets) | Where-Object { $_.name -eq $assetName -or $_.name -eq $shaName }) {
            Invoke-RestMethod -UseBasicParsing -Method Delete -Uri "$api/releases/assets/$($asset.id)" -Headers $headers | Out-Null
          }

          $uploadBase=([string]$release.upload_url) -replace '\{\?name,label\}$',''
          $exeUpload=('{0}?name={1}' -f $uploadBase,[uri]::EscapeDataString($assetName))
          $shaUpload=('{0}?name={1}' -f $uploadBase,[uri]::EscapeDataString($shaName))
          Invoke-RestMethod -UseBasicParsing -Method Post -Uri $exeUpload -Headers $headers -ContentType 'application/octet-stream' -InFile $exe | Out-Null
          Invoke-RestMethod -UseBasicParsing -Method Post -Uri $shaUpload -Headers $headers -ContentType 'application/octet-stream' -InFile $shaPath | Out-Null
          Write-Host "Published release $tag with $assetName and SHA-256 $hash"

      - name: Remove old SitecQC Actions artifacts
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $api="https://api.github.com/repos/$env:GH_REPOSITORY"
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='SitecQC-CI'
          }
          $response=Invoke-RestMethod -UseBasicParsing -Method Get -Uri "$api/actions/artifacts?per_page=100" -Headers $headers
          $targets=@($response.artifacts | Where-Object { [string]$_.name -like 'SitecQC-Windows-x64*' })
          foreach ($artifact in $targets) {
            Write-Host "Deleting old Actions artifact: $($artifact.name) [$($artifact.id)]"
            Invoke-RestMethod -UseBasicParsing -Method Delete -Uri "$api/actions/artifacts/$($artifact.id)" -Headers $headers | Out-Null
          }
          Write-Host "Deleted $($targets.Count) old SitecQC Actions artifact(s)."

      - name: Upload short-lived Actions artifact
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SitecQC-Windows-x64
          path: dist/SitecQC.exe
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
